;------------------ 设置分组标志位 ------------------

; 1. 节点选择主入口（加入我们自定义的“🛡️ openclash”）
custom_proxy_group=🚀 节点选择`select`[]🛡️ openclash`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🇰🇷 韩国节点`[]📶 官方优选`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=☑️ 手动切换`select`[]69云`[]freecloud`[]鸭一fr`.*
custom_proxy_group=♻️ 自动选择`url-test`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`http://www.gstatic.com/generate_204`300,,50

; 2. 定义大分组 A（使用 fallback 故障转移策略，严格按排列顺序优先）
; 顺序：A1(香港) -> A2(日本) -> A3(美国)，只有前面全挂才会用后面的，前面一恢复立刻切回
custom_proxy_group=🛡️ openclash`fallback`[]freecloud`[]鸭一fr`[]69云`http://www.gstatic.com/generate_204`300,,50

; 原有地区分组保持不变
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong|HKG)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|Tokyo|NRT|KIX)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|ATL|BUF|DFW|EWR|IAD|LAX|MCI|MIA|ORD|PHX|PDX|SEA|SJC)`http://www.gstatic.com/generate_204`300,,150
custom_proxy_group=🇹🇼 台湾节点`url-test`(台|新北|彰化|TW|Taiwan|TPE|KHH)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore|SIN)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(KR|Korea|KOR|Seoul|首尔|春川|韩|韓|ICN)`http://www.gstatic.com/generate_204`300,,50
; 3. 定义小分组 A1, A2, A3（利用正则表达式与关键词筛选节点，内部自动选最低延迟节点）
custom_proxy_group=freecloud`url-test`(freecloud)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=鸭一fr`url-test`(鸭一fr)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=69云`url-test`(69云)`http://www.gstatic.com/generate_204`300,,150

